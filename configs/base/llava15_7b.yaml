# LLaVA-1.5-7B 主模型配置（PROTOCOL §1.1）
# 固定分辨率，N0=576，L=32。revision 必须在第一次真实运行前锁定具体 commit hash。
model_id: "llava-hf/llava-1.5-7b-hf"
revision: "TBD_LOCK"
dtype: "float16"
attn_impl: "eager"          # 精度实验统一 eager，保证方法可比
patch_grid: [24, 24]
llm_layers: 32
max_new_tokens: 128         # 与 LLaVA 官方评测一致（PROTOCOL §1.3 v0.3）
# v0.3: 解码 do_sample=False, temperature=0, num_beams=1（贪心；三方法原仓库 eval 脚本均 --temperature 0）
temperature: 0
do_sample: false
num_beams: 1
bench_suffix: "Answer the question using a single word or phrase."